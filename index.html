<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKC Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #0d1b4a; color: white; text-align: center; }
        .card { background: white; color: #333; padding: 20px; border-radius: 10px; margin: 10px auto; max-width: 400px; }
        .table-box { background: white; color: #333; margin: 20px auto; max-width: 800px; padding: 20px; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; }
        .error-box { background: #ff5252; padding: 20px; border-radius: 10px; margin: 20px; }
        button { padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>MKC Commission Dashboard</h1>
    <div id="app">Loading...</div>

    <script>
        async function fetchData() {
            const app = document.getElementById('app');
            try {
                // Using just '/api/data' works automatically in Render
                const response = await fetch('/api/data');
                if (!response.ok) throw new Error('Server issues');
                const data = await response.json();
                
                app.innerHTML = `
                    <div class="card">
                        <h3>Total Employees</h3>
                        <h2>${data.employees.total}</h2>
                    </div>
                    <div class="table-box">
                        <table>
                            <thead><tr><th>Project</th><th>Region</th><th>Status</th></tr></thead>
                            <tbody>
                                ${data.projects.list.map(p => `
                                    <tr><td>${p.name}</td><td>${p.region}</td><td>${p.status}</td></tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } catch (error) {
                app.innerHTML = `
                    <div class="error-box">
                        <h2>⚠️ Connection Error</h2>
                        <p>The dashboard could not find the server. Please check Render Logs.</p>
                        <button onclick="fetchData()">Try Again</button>
                    </div>
                `;
            }
        }
        window.onload = fetchData;
    </script>
</body>
</html>
