<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MKC Commission Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; color: #333; }
    .navbar { background: #1a237e; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .stat-title { font-size: 14px; color: #777; text-transform: uppercase; }
    .stat-value { font-size: 32px; font-weight: bold; color: #1a237e; }
    .table-container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #f8f9fa; color: #1a237e; }
    .status-badge { padding: 5px 10px; border-radius: 15px; font-size: 12px; font-weight: bold; }
    .active-bg { background: #e8f5e9; color: #2e7d32; }
    .error-msg { color: #d32f2f; text-align: center; padding: 50px; }
  </style>
</head>
<body>

  <div class="navbar">
    <h2>MKC Commission Dashboard</h2>
    <button onclick="fetchData()" style="padding: 8px 15px; cursor: pointer;">Refresh</button>
  </div>

  <div class="container" id="app">
    <div style="text-align:center; padding:50px;">Loading data...</div>
  </div>

  <script>
    async function fetchData() {
      const app = document.getElementById('app');
      try {
        const response = await fetch('/api/data');
        if (!response.ok) throw new Error('Server issues');
        
        const data = await response.json();
        renderDashboard(data);
      } catch (error) {
        app.innerHTML = `
          <div class="error-msg">
            <h2>⚠️ Connection Error</h2>
            <p>Could not reach the server. Please check if the Render service is running.</p>
            <button onclick="fetchData()" style="margin-top:15px; padding:10px 20px;">Try Again</button>
          </div>`;
      }
    }

    function renderDashboard(data) {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-title">Employees</div>
            <div class="stat-value">${data.employees.total}</div>
          </div>
          <div class="stat-card">
            <div class="stat-title">Projects</div>
            <div class="stat-value">${data.projects.total}</div>
          </div>
          <div class="stat-card">
            <div class="stat-title">Last Update</div>
            <div style="font-size:16px;">${data.lastUpdated}</div>
          </div>
        </div>

        <div class="table-container">
          <h3>Current Projects</h3>
          <table>
            <thead>
              <tr><th>Project Name</th><th>Region</th><th>Status</th></tr>
            </thead>
            <tbody>
              ${data.projects.list.map(p => `
                <tr>
                  <td><strong>${p.name}</strong></td>
                  <td>${p.region}</td>
                  <td><span class="status-badge active-bg">${p.status}</span></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    window.onload = fetchData;
  </script>
</body>
</html>
